<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ─── ALMACENAMIENTO LOCAL (todo se queda en este dispositivo) ───────────────
const STORAGE_KEY = "finanzas-andres-v1";
const API_KEY_STORAGE = "finanzas-andres-gemini-key";

// Datos en blanco: vos cargás tus cifras reales la primera vez que abrís la
// app, y quedan guardadas solo en este teléfono (nunca en el código fuente).
const initialData = {
  cuentas: [{ id: "efectivo", nombre: "Efectivo", saldo: 0 }],
  deudas: [],
  gastosFijos: [],
  gastos: [],
  presupuestos: [],
  ingresos: [],
  metas: [],
  prestamos: [],
  negocios: [],
  movimientos: [],
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        ...initialData,
        ...parsed,
        cuentas: parsed.cuentas && parsed.cuentas.length ? parsed.cuentas : initialData.cuentas,
        ingresos: parsed.ingresos || [],
        movimientos: parsed.movimientos || [],
      };
    }
  } catch (e) {}
  return initialData;
}

const CATEGORIAS = ["comida", "transporte", "ocio", "ropa", "salud", "imprevisto", "otro"];
const CATEGORIA_COLORS = {
  comida: "#FF9F0A", transporte: "#0A84FF", ocio: "#BF5AF2", ropa: "#FF375F",
  salud: "#30D158", imprevisto: "#FF453A", otro: "#6B7280",
};

// Material "Liquid Glass" (iOS 26): traslúcido, con saturación elevada para
// simular refracción, y un filo claro arriba que imita el brillo del vidrio.
function formatCOP(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return "$" + Number(n).toLocaleString("es-CO", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function diasRestantes(fecha) {
  const hoy = new Date();
  const f = new Date(fecha);
  return Math.ceil((f - hoy) / (1000 * 60 * 60 * 24));
}

// Centraliza: mueve dinero entre una cuenta y el mundo, y deja registro en
// el historial unificado. Todo movimiento de plata pasa por acá.
function aplicarMovimiento(data, { tipo, monto, signo, descripcion, cuentaId, fecha }) {
  const cuenta = data.cuentas.find(c => c.id === cuentaId) || data.cuentas[0];
  const delta = signo === "+" ? monto : -monto;
  const mov = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    tipo, monto, signo, descripcion,
    cuentaId: cuenta ? cuenta.id : null,
    cuentaNombre: cuenta ? cuenta.nombre : "—",
    fecha: fecha || new Date().toISOString().split("T")[0],
  };
  return {
    ...data,
    cuentas: data.cuentas.map(c => (cuenta && c.id === cuenta.id) ? { ...c, saldo: c.saldo + delta } : c),
    movimientos: [mov, ...data.movimientos],
  };
}


// ─── VALIDACIÓN DE SALDO ────────────────────────────────────────────────────
function saldoSuficiente(data, cuentaId, monto) {
  const cuenta = data.cuentas.find(c => c.id === cuentaId) || data.cuentas[0];
  if (!cuenta) return false;
  return cuenta.saldo >= monto;
}
function mensajeSaldoInsuf(data, cuentaId, monto) {
  const cuenta = data.cuentas.find(c => c.id === cuentaId) || data.cuentas[0];
  if (!cuenta) return "Sin cuenta seleccionada";
  const faltante = monto - cuenta.saldo;
  return `Saldo insuficiente en ${cuenta.nombre}. Tenés ${formatCOP(cuenta.saldo)}, faltan ${formatCOP(faltante)}.`;
}

function proyeccionFinMes(gastado, dia, diasDelMes) {
  return dia > 0 ? Math.round((gastado / dia) * diasDelMes) : 0;
}

function resumenFinanciero(data) {
  const hoy = new Date();
  const mes = hoy.toISOString().slice(0, 7);
  const dia = hoy.getDate();
  const diasDelMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
  const gastos = data.gastos.filter(g => g.fecha && g.fecha.startsWith(mes)).reduce((a, g) => a + g.monto, 0);
  const ingresos = (data.ingresos || []).filter(i => i.fecha && i.fecha.startsWith(mes)).reduce((a, i) => a + i.monto, 0);
  const saldo = data.cuentas.reduce((a, c) => a + c.saldo, 0);
  const deudas = data.deudas.reduce((a, d) => a + d.saldo, 0);
  const proyeccion = proyeccionFinMes(gastos, dia, diasDelMes);
  const flujo = ingresos - proyeccion;
  const presupuestoExcedido = (data.presupuestos || []).some(p => gastosPorCategoria(data, mes, p.categoria) > p.monto);
  const puntaje = Math.max(0, Math.min(100, 50 + (ingresos ? (flujo >= 0 ? 25 : -25) : 0) + (saldo >= deudas ? 15 : -10) - (presupuestoExcedido ? 10 : 0)));
  return { gastos, ingresos, proyeccion, flujo, puntaje };
}

function gastosPorCategoria(data, mes, categoria) {
  return data.gastos.filter(g => g.fecha && g.fecha.startsWith(mes) && g.categoria === categoria).reduce((a, g) => a + g.monto, 0);
}

function transferirEntreCuentas(data, { desdeId, haciaId, monto, fecha }) {
  if (!monto || desdeId === haciaId) return data;
  const desde = data.cuentas.find(c => c.id === desdeId);
  const hacia = data.cuentas.find(c => c.id === haciaId);
  if (!desde || !hacia) return data;
  const mov = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), tipo: "transferencia", monto, signo: "↔", descripcion: `Transferencia: ${desde.nombre} → ${hacia.nombre}`, cuentaId: desde.id, cuentaNombre: desde.nombre, fecha };
  return { ...data, cuentas: data.cuentas.map(c => c.id === desdeId ? { ...c, saldo: c.saldo - monto } : c.id === haciaId ? { ...c, saldo: c.saldo + monto } : c), movimientos: [mov, ...data.movimientos] };
}

console.assert(proyeccionFinMes(100, 10, 30) === 300, "proyeccionFinMes debe proyectar el ritmo diario");

// ─── IA: convierte texto libre en un movimiento estructurado ────────────────
async function parseConIA(texto, apiKey, contexto) {
  const listaDeudas = (contexto.deudas || []).map(d => d.nombre).join(", ") || "ninguna";
  const listaMetas = (contexto.metas || []).map(m => m.nombre).join(", ") || "ninguna";
  const listaPrestamos = (contexto.prestamos || []).map(p => `${p.persona} (${p.tipo})`).join(", ") || "ninguno";
  const listaNegocios = (contexto.negocios || []).filter(n => n.estado === "en curso").map(n => n.nombre).join(", ") || "ninguno";

  const prompt = `Analiza este texto en español donde una persona describe un movimiento de dinero personal: "${texto}"

Elegí el tipo que mejor corresponda:
- gasto: un gasto normal (comida, transporte, etc.), sin relación a lo de abajo
- ingreso: plata que entra (sueldo, pago, etc.), sin relación a lo de abajo
- abono_deuda: pago a una deuda propia. Deudas registradas: ${listaDeudas}
- aporte_meta: plata que se aparta/ahorra para una meta. Metas registradas: ${listaMetas}
- abono_prestamo: pago relacionado a plata prestada entre personas (le pagaste a alguien o alguien te pagó a vos). Préstamos registrados: ${listaPrestamos}
- negocio_compra: comprar algo nuevo para revender
- negocio_venta: vender algo que ya estaba en curso para revender. En curso: ${listaNegocios}

Responde con un objeto que tenga:
- tipo: uno de los valores de arriba
- monto: el valor numérico en pesos colombianos, sin puntos, comas ni símbolo de moneda (solo el número). Si no hay un monto claro, usa 0.
- categoria: si tipo es "gasto", la más adecuada entre: ${CATEGORIAS.join(", ")}. Si no, usa "ingreso".
- descripcion: descripción corta (máximo 5 palabras). Para "negocio_compra" usá el nombre del producto.
- entidad: solo si tipo es "abono_deuda", "aporte_meta" o "negocio_venta", copiá EXACTO uno de los nombres listados arriba que coincida con el texto. Solo si tipo es "abono_prestamo", copiá EXACTO el nombre de la persona (sin el paréntesis). En cualquier otro caso, o si ninguno coincide claramente, dejalo como cadena vacía.`;

  const schema = {
    type: "object",
    properties: {
      tipo: { type: "string", enum: ["gasto", "ingreso", "abono_deuda", "aporte_meta", "abono_prestamo", "negocio_compra", "negocio_venta"] },
      monto: { type: "number" },
      categoria: { type: "string", enum: [...CATEGORIAS, "ingreso"] },
      descripcion: { type: "string" },
      entidad: { type: "string" },
    },
    required: ["tipo", "monto", "categoria", "descripcion", "entidad"],
  };

  const resp = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
    {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: "application/json", responseSchema: schema },
      }),
    }
  );

  if (!resp.ok) {
    const errText = await resp.text().catch(() => "");
    throw new Error("HTTP " + resp.status + (errText ? ": " + errText.slice(0, 150) : ""));
  }

  const data = await resp.json();
  const textOut =
    data && data.candidates && data.candidates[0] && data.candidates[0].content &&
    data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
    data.candidates[0].content.parts[0].text;
  if (!textOut) throw new Error("Respuesta vacía de la IA");
  return JSON.parse(textOut);
}

async function consultarFinanzasIA(pregunta, data, apiKey) {
  const resumen = resumenFinanciero(data);
  const contexto = {
    cuentas: data.cuentas.map(c => ({ nombre: c.nombre, saldo: c.saldo })),
    deudas: data.deudas.map(d => ({ nombre: d.nombre, saldo: d.saldo })),
    metas: data.metas.map(m => ({ nombre: m.nombre, actual: m.actual, objetivo: m.objetivo })),
    presupuestos: data.presupuestos || [],
    resumen,
  };
  const resp = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
    body: JSON.stringify({ contents: [{ parts: [{ text: `Respondé en español, de forma breve y prudente, usando solo estos datos financieros locales: ${JSON.stringify(contexto)}. Pregunta: ${pregunta}` }] }] }),
  });
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const resultado = await resp.json();
  const texto = resultado?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!texto) throw new Error("Respuesta vacía de la IA");
  return texto;
}


// ─── INPUT MONTO: muestra puntos de miles mientras escribís ──────────────────
function formatInput(raw) {
  // raw: string interno tipo "15000.5" (punto = decimal, formato JS).
  // Devuelve para mostrar con puntos de miles y coma decimal: "15.000,5"
  if (!raw) return "";
  const [intPart, decPart] = String(raw).split(".");
  const intFormatted = intPart ? Number(intPart).toLocaleString("es-CO") : "0";
  return (decPart !== undefined && decPart !== "") ? intFormatted + "," + decPart : intFormatted;
}

function InputMonto({ label, value, onChange, placeholder }) {
  // value: string "crudo" en formato JS, ej. "15000" o "15000.5"
  const [enfocado, setEnfocado] = useState(false);
  const [texto, setTexto] = useState("");

  function handleFocus() {
    setEnfocado(true);
    setTexto(value ? String(value).replace(".", ",") : "");
  }
  function handleBlur() { setEnfocado(false); }

  function handleChange(e) {
    // Reconstruimos char por char: dígitos siempre, y como máximo UN separador decimal
    // (evita que un punto de miles ya escrito se confunda con un decimal nuevo)
    let vistoSeparador = false;
    let limpio = "";
    for (const ch of e.target.value) {
      if (ch >= "0" && ch <= "9") limpio += ch;
      else if ((ch === "," || ch === ".") && !vistoSeparador) { limpio += ","; vistoSeparador = true; }
    }
    const [ent, dec] = limpio.split(",");
    const final = dec !== undefined ? ent + "," + dec.slice(0, 2) : ent;
    setTexto(final);
    onChange(final.replace(",", "."));
  }

  const mostrado = enfocado ? texto : (value ? formatInput(String(value)) : "");

  return (
    <div className="ios-field">
      {label && <label>{label}</label>}
      <div className="pt-node pt-relative">
        <span className="ios-currency pt-absolute">$</span>
        <input
          inputMode="decimal"
          value={mostrado}
          onFocus={handleFocus}
          onBlur={handleBlur}
          onChange={handleChange}
          placeholder={placeholder || "0"}
          className="ios-control ios-money"
        />
      </div>
    </div>
  );
}

// ─── COLOR AUTOMÁTICO POR NOMBRE DE CUENTA ───────────────────────────────────
const CUENTA_COLORES = {
  bancolombia: "#FF9F0A",
  nequi:       "#BF5AF2",
  nu:          "#8B00FF",
  nubank:      "#8B00FF",
  daviplata:   "#FF453A",
  davivienda:  "#FF453A",
  bbva:        "#0A84FF",
  itau:        "#F97316",
  paypal:      "#1E90FF",
  payoneer:    "#FF6600",
  efectivo:    "#30D158",
  cash:        "#30D158",
  ahorro:      "#64D2FF",
  default:     "#5E5CE6",
};

function colorCuenta(nombre) {
  if (!nombre) return CUENTA_COLORES.default;
  const key = nombre.toLowerCase().replace(/[^a-z]/g, "");
  for (const [k, v] of Object.entries(CUENTA_COLORES)) {
    if (key.includes(k)) return v;
  }
  // Generar color determinista del nombre si no hay match
  let hash = 0;
  for (let i = 0; i < nombre.length; i++) hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 70%, 60%)`;
}

// Icono/inicial de cuenta
function IconoCuenta({ nombre, size = 22 }) {
  const color = colorCuenta(nombre);
  const inicial = (nombre || "?")[0].toUpperCase();
  return (
    <div className="ios-account-icon">{inicial}</div>
  );
}

// ─── CUENTAS (carteras: banco, efectivo, PayPal, etc.) ──────────────────────
function Cuentas({ open, onClose, data, setData }) {
  const [vista, setVista] = useState("lista");
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({});
  const total = data.cuentas.reduce((a, c) => a + c.saldo, 0);

  useEffect(() => { if (open) { setVista("lista"); setForm({}); } }, [open]);

  function abrirEditar(c) { setForm({ nombre: c.nombre, saldo: c.saldo }); setEditId(c.id); setVista("editar"); }
  function abrirNueva() { setForm({}); setVista("nueva"); }
  function abrirTransferencia() { setForm({ desdeId: data.cuentas[0]?.id || "", haciaId: data.cuentas[1]?.id || "" }); setVista("transferir"); }

  function crear() {
    const nueva = { id: Date.now(), nombre: form.nombre || "Nueva cuenta", saldo: parseFloat(form.saldo || 0) };
    setData(d => ({ ...d, cuentas: [...d.cuentas, nueva] }));
    setVista("lista");
  }
  function guardar() {
    setData(d => ({ ...d, cuentas: d.cuentas.map(c => c.id === editId ? { ...c, nombre: form.nombre || c.nombre, saldo: parseFloat(form.saldo || 0) } : c) }));
    setVista("lista");
  }
  function eliminar() {
    setData(d => ({ ...d, cuentas: d.cuentas.filter(c => c.id !== editId) }));
    setVista("lista");
  }
  function transferir() {
    const monto = parseFloat(form.monto || 0);
    if (!monto || form.desdeId === form.haciaId) return;
    if (!saldoSuficiente(data, form.desdeId, monto)) { alert(mensajeSaldoInsuf(data, form.desdeId, monto)); return; }
    setData(d => transferirEntreCuentas(d, { desdeId: form.desdeId, haciaId: form.haciaId, monto, fecha: new Date().toISOString().split("T")[0] }));
    setVista("lista");
  }

  return (
    <Modal open={open} onClose={onClose} title={vista === "lista" ? "Tus cuentas" : vista === "nueva" ? "Nueva cuenta" : vista === "transferir" ? "Transferir dinero" : "Editar cuenta"}>
      {vista === "lista" && (
        <>
          <div className="pt-node pt-space">
            Total unificado: <span className="pt-node">{formatCOP(total)}</span>
          </div>
          {data.cuentas.length === 0 && <div className="pt-node pt-space">Todavía no tenés cuentas creadas.</div>}
          {data.cuentas.length > 0 && (
            <div className="pt-node pt-clip pt-space">
              {data.cuentas.map((c, i) => (
                <Row key={c.id} onClick={() => abrirEditar(c)} last={i === data.cuentas.length - 1}>
                  <div className="pt-node pt-flex pt-center">
                    <IconoCuenta nombre={c.nombre} size={32} />
                    <div>
                      <div className="pt-node">{c.nombre}</div>
                      <div className="pt-node">{formatCOP(c.saldo)}</div>
                    </div>
                  </div>
                  <Icon name="chevron" size={16} color="rgba(235,235,245,0.35)" />
                </Row>
              ))}
            </div>
          )}
          <Btn variant="ghost" onClick={abrirNueva} className="pt-node pt-full">+ Agregar cuenta</Btn>
          {data.cuentas.length > 1 && <Btn variant="ghost" onClick={abrirTransferencia} className="pt-node pt-full pt-space-top">↔ Transferir entre cuentas</Btn>}
        </>
      )}
      {(vista === "nueva" || vista === "editar") && (
        <>
          <Input label="Nombre" value={form.nombre || ""} onChange={e => setForm(f => ({ ...f, nombre: e.target.value }))} placeholder="Ej: Bancolombia, Efectivo, PayPal" />
          <InputMonto label={vista === "nueva" ? "Saldo inicial (COP)" : "Saldo (COP)"} value={form.saldo ?? ""} onChange={v => setForm(f => ({ ...f, saldo: v }))} />
          <div className="pt-node pt-flex pt-space">
            <Btn onClick={vista === "nueva" ? crear : guardar} className="pt-node pt-grow">Guardar</Btn>
            <Btn variant="ghost" onClick={() => setVista("lista")} className="pt-node pt-grow">Cancelar</Btn>
          </div>
          {vista === "editar" && <Btn variant="danger" onClick={eliminar} className="pt-node pt-full">Eliminar cuenta</Btn>}
        </>
      )}
      {vista === "transferir" && (
        <>
          <Select label="Desde" value={form.desdeId || ""} onChange={e => setForm(f => ({ ...f, desdeId: e.target.value }))}>
            {data.cuentas.map(c => <option key={c.id} value={c.id}>{c.nombre} ({formatCOP(c.saldo)})</option>)}
          </Select>
          <Select label="Hacia" value={form.haciaId || ""} onChange={e => setForm(f => ({ ...f, haciaId: e.target.value }))}>
            {data.cuentas.filter(c => c.id !== form.desdeId).map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
          </Select>
          <InputMonto label="Monto (COP)" value={form.monto || ""} onChange={v => setForm(f => ({ ...f, monto: v }))} />
          <div className="pt-node pt-flex">
            <Btn onClick={transferir} className="pt-node pt-grow">Transferir</Btn>
            <Btn variant="ghost" onClick={() => setVista("lista")} className="pt-node pt-grow">Cancelar</Btn>
          </div>
        </>
      )}
    </Modal>
  );
}

// ─── TENDENCIA MENSUAL (últimos 12 meses) ────────────────────────────────────
function TendenciaMensual({ data }) {
  const [tooltip, setTooltip] = useState(null);
  const hoy = new Date();
  const mesHoy = hoy.toISOString().slice(0, 7);
  const meses = [];
  for (let i = 11; i >= 0; i--) {
    meses.push(new Date(hoy.getFullYear(), hoy.getMonth() - i, 1).toISOString().slice(0, 7));
  }
  const filas = meses.map(mes => ({
    mes,
    label: new Date(Number(mes.split("-")[0]), Number(mes.split("-")[1]) - 1, 1)
      .toLocaleDateString("es-CO", { month: "short" }).replace(".", ""),
    gastado: data.gastos.filter(g => g.fecha && g.fecha.startsWith(mes)).reduce((a, g) => a + g.monto, 0),
    ingresado: (data.ingresos || []).filter(i => i.fecha && i.fecha.startsWith(mes)).reduce((a, i) => a + i.monto, 0),
  }));
  const max = Math.max(1, ...filas.map(f => Math.max(f.gastado, f.ingresado)));
  const BAR_H = 72;

  return (
    <Card>
      <div className="pt-node pt-space">ÚLTIMOS 12 MESES</div>
      <div className="pt-node pt-flex">
        {filas.map(f => {
          const gh = Math.max(3, Math.round((f.gastado / max) * BAR_H));
          const ih = Math.max(3, Math.round((f.ingresado / max) * BAR_H));
          const esMes = f.mes === mesHoy;
          const activo = tooltip === f.mes;
          return (
            <div
              key={f.mes}
              onClick={() => setTooltip(activo ? null : f.mes)}
              className="pt-node pt-flex pt-column pt-center pt-grow pt-relative pressable"
            >
              {activo && (
                <div className="pt-node pt-absolute pt-space">
                  <div className="pt-node">−{formatCOP(f.gastado)}</div>
                  <div className="pt-node">+{formatCOP(f.ingresado)}</div>
                </div>
              )}
              <div className="pt-node pt-flex">
                <div className="pt-node" />
                <div className="pt-node" />
              </div>
              <div className="pt-node">
                {f.label}
              </div>
            </div>
          );
        })}
      </div>
      <div className="pt-node pt-flex pt-space-top">
        <div className="pt-node pt-flex pt-center">
          <div className="pt-node" />
          <span className="pt-node">Gastos</span>
        </div>
        <div className="pt-node pt-flex pt-center">
          <div className="pt-node" />
          <span className="pt-node">Ingresos</span>
        </div>
        <span className="pt-node">toca una barra para ver</span>
      </div>
    </Card>
  );
}

// ─── DEUDAS ──────────────────────────────────────────────────────────────────
function Deudas({ data, setData }) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});

  function abonar(id) {
    const monto = parseFloat(form.monto || 0);
    if (!monto) return;
    const cuentaId = form.cuentaId || (data.cuentas[0] && data.cuentas[0].id);
    if (!saldoSuficiente(data, cuentaId, monto)) { alert(mensajeSaldoInsuf(data, cuentaId, monto)); return; }
    const fecha = new Date().toISOString().split("T")[0];
    setData(d => {
      const deu = d.deudas.find(x => x.id === id);
      const d2 = aplicarMovimiento(d, { tipo: "abono_deuda", monto, signo: "-", descripcion: "Abono a " + (deu ? deu.nombre : "deuda"), cuentaId, fecha });
      return {
        ...d2,
        deudas: d.deudas.map(deu2 => deu2.id === id
          ? { ...deu2, saldo: Math.max(0, deu2.saldo - monto), abonos: [...deu2.abonos, { monto, fecha, cuentaId }] }
          : deu2),
      };
    });
    setModal(null); setForm({});
  }

  function agregarDeuda() {
    const nueva = { id: Date.now(), nombre: form.nombre || "Nueva deuda", saldo: parseFloat(form.saldo || 0), fechaPago: form.fechaPago || "", interesMensual: parseFloat(form.interes || 0), comisiones: parseFloat(form.comisiones || 0), abonos: [] };
    setData(d => ({ ...d, deudas: [...d.deudas, nueva] }));
    setModal(null); setForm({});
  }

  return (
    <div>
      {data.deudas.map(d => (
        <Card key={d.id}>
          <div className="pt-node pt-flex pt-between pt-space">
            <div>
              <div className="pt-node">{d.nombre}</div>
              <div className="pt-node pt-space-top">{formatCOP(d.saldo)}</div>
            </div>
            {d.fechaPago && <Badge color={diasRestantes(d.fechaPago) <= 10 ? "#FF453A" : "#FF9F0A"}>{diasRestantes(d.fechaPago)}d</Badge>}
          </div>
          {d.fechaPago && <div className="pt-node pt-space">Vence: {new Date(d.fechaPago).toLocaleDateString("es-CO", { day: "numeric", month: "long", year: "numeric" })}</div>}
          {(d.interesMensual > 0 || d.comisiones > 0) && (
            <div className="pt-node pt-flex pt-space">
              {d.interesMensual > 0 && <Badge color="#FF453A">Interés {formatCOP(d.interesMensual)}/mes</Badge>}
              {d.comisiones > 0 && <Badge color="#FF9F0A">Comisiones {formatCOP(d.comisiones)}/mes</Badge>}
            </div>
          )}
          {d.abonos.length > 0 && <div className="pt-node pt-space">{d.abonos.length} abono(s) registrado(s)</div>}
          <Btn onClick={() => { setModal("abonar-" + d.id); setForm({ cuentaId: data.cuentas[0]?.id }); }} className="pt-node pt-full">Registrar abono</Btn>
          <Modal open={modal === "abonar-" + d.id} onClose={() => setModal(null)} title={`Abonar a ${d.nombre}`}>
            <div className="pt-node pt-space">Saldo actual: {formatCOP(d.saldo)}</div>
            <InputMonto label="Monto del abono" value={form.monto || ""} onChange={v => setForm(f => ({ ...f, monto: v }))} />
            <SelectorCuenta cuentas={data.cuentas} value={form.cuentaId} onChange={v => setForm(f => ({ ...f, cuentaId: v }))} />
            <div className="pt-node pt-flex">
              <Btn onClick={() => abonar(d.id)} className="pt-node pt-grow">Abonar</Btn>
              <Btn variant="ghost" onClick={() => setModal(null)} className="pt-node pt-grow">Cancelar</Btn>
            </div>
          </Modal>
        </Card>
      ))}
      <Btn onClick={() => { setModal("nueva"); setForm({}); }} variant="ghost" className="pt-node pt-full">+ Agregar deuda</Btn>
      <Modal open={modal === "nueva"} onClose={() => setModal(null)} title="Nueva deuda">
        <Input label="Nombre" value={form.nombre || ""} onChange={e => setForm(f => ({ ...f, nombre: e.target.value }))} placeholder="Ej: Banco XYZ" />
        <InputMonto label="Saldo (COP)" value={form.saldo || ""} onChange={v => setForm(f => ({ ...f, saldo: v }))} />
        <Input label="Fecha límite de pago" type="date" value={form.fechaPago || ""} onChange={e => setForm(f => ({ ...f, fechaPago: e.target.value }))} />
        <InputMonto label="Interés mensual (COP)" value={form.interes || ""} onChange={v => setForm(f => ({ ...f, interes: v }))} />
        <InputMonto label="Comisiones mensuales (COP)" value={form.comisiones || ""} onChange={v => setForm(f => ({ ...f, comisiones: v }))} />
        <div className="pt-node pt-flex">
          <Btn onClick={agregarDeuda} className="pt-node pt-grow">Guardar</Btn>
          <Btn variant="ghost" onClick={() => setModal(null)} className="pt-node pt-grow">Cancelar</Btn>
        </div>
      </Modal>
    </div>
  );
}

// ─── GASTOS (incluye checklist de gastos fijos del mes) ──────────────────────
function Gastos({ data, setData }) {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({});
  const [fijoModal, setFijoModal] = useState(null);
  const [fijoForm, setFijoForm] = useState({});
  const [presupuestoModal, setPresupuestoModal] = useState(false);
  const [presupuestoForm, setPresupuestoForm] = useState({});
  const mesActual = new Date().toISOString().slice(0, 7);
  const gastosMes = data.gastos.filter(g => g.fecha && g.fecha.startsWith(mesActual));
  const totalMes = gastosMes.reduce((a, g) => a + g.monto, 0);

  const porCategoria = CATEGORIAS.map(cat => ({
    cat, total: gastosMes.filter(g => g.categoria === cat).reduce((a, g) => a + g.monto, 0),
  })).filter(c => c.total > 0);

  function agregar() {
    const cuentaId = form.cuentaId || (data.cuentas[0] && data.cuentas[0].id);
    const monto = parseFloat(form.monto || 0);
    if (!monto) return;
    if (!saldoSuficiente(data, cuentaId, monto)) { alert(mensajeSaldoInsuf(data, cuentaId, monto)); return; }
    const fecha = new Date().toISOString().split("T")[0];
    const nuevo = { id: Date.now(), descripcion: form.descripcion || "Gasto", monto, categoria: form.categoria || "otro", fecha, cuentaId };
    setData(d => {
      const d2 = aplicarMovimiento(d, { tipo: "gasto", monto: nuevo.monto, signo: "-", descripcion: nuevo.descripcion, cuentaId, fecha });
      return { ...d2, gastos: [nuevo, ...d.gastos] };
    });
    setModal(false); setForm({});
  }

  function eliminar(id) {
    const g = data.gastos.find(x => x.id === id);
    if (!g) return;
    setData(d => {
      const d2 = aplicarMovimiento(d, { tipo: "reverso", monto: g.monto, signo: "+", descripcion: "Reverso: " + g.descripcion, cuentaId: g.cuentaId, fecha: new Date().toISOString().split("T")[0] });
      return { ...d2, gastos: d.gastos.filter(x => x.id !== id) };
    });
  }

  function fijoDelMes(fijoId) {
    return data.gastos.find(g => g.fijoId === fijoId && g.fecha.startsWith(mesActual));
  }

  function pagarFijo(fijo) {
    const cuentaId = fijoForm.cuentaId || (data.cuentas[0] && data.cuentas[0].id);
    const monto = parseFloat(fijoForm.monto !== undefined && fijoForm.monto !== "" ? fijoForm.monto : fijo.monto);
    if (!monto) return;
    if (!saldoSuficiente(data, cuentaId, monto)) { alert(mensajeSaldoInsuf(data, cuentaId, monto)); return; }
    const fecha = new Date().toISOString().split("T")[0];
    const nuevo = { id: Date.now(), descripcion: fijo.nombre, monto, categoria: fijo.categoria || "otro", fecha, cuentaId, fijoId: fijo.id };
    setData(d => {
      const d2 = aplicarMovimiento(d, { tipo: "gasto", monto, signo: "-", descripcion: fijo.nombre, cuentaId, fecha });
      return { ...d2, gastos: [nuevo, ...d.gastos] };
    });
    setFijoModal(null); setFijoForm({});
  }

  function deshacerFijo(fijoId) {
    const g = fijoDelMes(fijoId);
    if (g) eliminar(g.id);
  }

  function guardarFijo() {
    if (fijoModal === "nuevo") {
      const nuevo = { id: Date.now(), nombre: fijoForm.nombre || "Nuevo gasto fijo", monto: parseFloat(fijoForm.monto || 0), categoria: fijoForm.categoria || "otro", nota: fijoForm.nota || "" };
      setData(d => ({ ...d, gastosFijos: [...d.gastosFijos, nuevo] }));
    } else if (fijoModal && fijoModal.startsWith("editar-")) {
      const id = Number(fijoModal.slice(7));
      setData(d => ({ ...d, gastosFijos: d.gastosFijos.map(g => g.id === id ? { ...g, nombre: fijoForm.nombre || g.nombre, monto: parseFloat(fijoForm.monto || 0), categoria: fijoForm.categoria || g.categoria, nota: fijoForm.nota || "" } : g) }));
    }
    setFijoModal(null); setFijoForm({});
  }

  function eliminarFijo(id) {
    setData(d => ({ ...d, gastosFijos: d.gastosFijos.filter(g => g.id !== id) }));
    setFijoModal(null);
  }
  function guardarPresupuesto() {
    const categoria = presupuestoForm.categoria || "otro";
    const monto = parseFloat(presupuestoForm.monto || 0);
    if (!monto) return;
    setData(d => {
      const actual = d.presupuestos || [];
      const existe = actual.some(p => p.categoria === categoria);
      return { ...d, presupuestos: existe ? actual.map(p => p.categoria === categoria ? { ...p, monto } : p) : [...actual, { categoria, monto }] };
    });
    setPresupuestoModal(false); setPresupuestoForm({});
  }
  function eliminarPresupuesto(categoria) {
    setData(d => ({ ...d, presupuestos: (d.presupuestos || []).filter(p => p.categoria !== categoria) }));
  }

  return (
    <div>
      <Card className="pt-node">
        <div className="pt-node">GASTADO ESTE MES</div>
        <div className="pt-node">{formatCOP(totalMes)}</div>
        <div className="pt-node pt-space-top">{gastosMes.length} movimiento(s)</div>
      </Card>

      <Card>
        <div className="pt-node pt-flex pt-between pt-center pt-space">
          <div className="pt-node">GASTOS FIJOS DE ESTE MES</div>
          <button onClick={() => { setFijoForm({}); setFijoModal("nuevo"); }} className="pt-node pressable ios-button">+ Agregar</button>
        </div>
        {data.gastosFijos.length === 0 && <div className="pt-node">No tenés gastos fijos configurados.</div>}
        {data.gastosFijos.map(fijo => {
          const cumplido = fijoDelMes(fijo.id);
          return (
            <div key={fijo.id} className="pt-node pt-flex pt-between pt-center">
              <div className="pt-node pt-flex pt-center">
                <span className="pt-node pt-flex">
                  <Icon name="check" size={20} color={cumplido ? "#30D158" : "rgba(235,235,245,0.3)"} strokeWidth={2.2} filled={false} />
                </span>
                <div>
                  <div className="pt-node">{fijo.nombre}</div>
                  <div className="pt-node">{formatCOP(cumplido ? cumplido.monto : fijo.monto)}{fijo.nota ? " · " + fijo.nota : ""}</div>
                </div>
              </div>
              <div className="pt-node pt-flex pt-center">
                {cumplido
                  ? <button onClick={() => deshacerFijo(fijo.id)} className="pt-node pressable ios-button">Deshacer</button>
                  : <Btn onClick={() => { setFijoForm({ monto: fijo.monto, cuentaId: data.cuentas[0]?.id }); setFijoModal("pagar-" + fijo.id); }} className="pt-node">Pagar</Btn>}
                <button onClick={() => { setFijoForm({ nombre: fijo.nombre, monto: fijo.monto, categoria: fijo.categoria, nota: fijo.nota }); setFijoModal("editar-" + fijo.id); }} className="pt-node pressable ios-button">✏️</button>
              </div>
            </div>
          );
        })}
      </Card>

      <Card>
        <div className="pt-node pt-flex pt-between pt-center pt-space">
          <div className="ios-section-label">PRESUPUESTOS</div>
          <button onClick={() => { setPresupuestoForm({}); setPresupuestoModal(true); }} className="ios-text-button">Configurar</button>
        </div>
        {(data.presupuestos || []).length === 0 && <div className="ios-muted">Definí un límite por categoría para ver cuánto te queda.</div>}
        {(data.presupuestos || []).map(p => {
          const gastado = gastosPorCategoria(data, mesActual, p.categoria);
          const restante = p.monto - gastado;
          return (
            <div key={p.categoria} className="pt-node pt-space">
              <div className="pt-node pt-flex pt-between pt-center">
                <span>{p.categoria}</span>
                <button onClick={() => eliminarPresupuesto(p.categoria)} className="ios-plain-button" aria-label={`Eliminar presupuesto de ${p.categoria}`}>×</button>
              </div>
              <ProgressBar value={gastado} max={p.monto} />
              <div className="ios-muted">{formatCOP(gastado)} de {formatCOP(p.monto)} · {restante >= 0 ? `quedan ${formatCOP(restante)}` : `superaste ${formatCOP(Math.abs(restante))}`}</div>
            </div>
          );
        })}
      </Card>

      {porCategoria.length > 0 && (
        <Card>
          <div className="pt-node pt-space">POR CATEGORÍA</div>
          {porCategoria.map(c => (
            <div key={c.cat} className="pt-node pt-space">
              <div className="pt-node pt-flex pt-between pt-space">
                <span className="pt-node">{c.cat}</span>
                <span className="pt-node">{formatCOP(c.total)}</span>
              </div>
              <ProgressBar value={c.total} max={totalMes} color={CATEGORIA_COLORS[c.cat] || "#5E5CE6"} />
            </div>
          ))}
        </Card>
      )}

      <Btn onClick={() => { setModal(true); setForm({ cuentaId: data.cuentas[0]?.id }); }} className="pt-node pt-full pt-space">+ Registrar gasto</Btn>

      {gastosMes.length === 0 && <div className="pt-node pt-text-center">Sin gastos este mes</div>}

      {gastosMes.map(g => (
        <Card key={g.id} className="pt-node">
          <div className="pt-node pt-flex pt-between pt-center">
            <div>
              <div className="pt-node">{g.descripcion}</div>
              <div className="pt-node pt-flex pt-center pt-space-top">
                <Badge color={CATEGORIA_COLORS[g.categoria] || "#5E5CE6"}>{g.categoria}</Badge>
                {g.fijoId && <Badge color="#5E5CE6">🔁 Fijo</Badge>}
                <span className="pt-node">{(data.cuentas.find(c => c.id === g.cuentaId) || {}).nombre || "—"} · {g.fecha}</span>
              </div>
            </div>
            <div className="pt-node pt-flex pt-center">
              <span className="pt-node">{formatCOP(g.monto)}</span>
              <button onClick={() => eliminar(g.id)} className="pt-node pressable ios-button">🗑</button>
            </div>
          </div>
        </Card>
      ))}

      <Modal open={modal} onClose={() => setModal(false)} title="Nuevo gasto">
        <Input label="Descripción" value={form.descripcion || ""} onChange={e => setForm(f => ({ ...f, descripcion: e.target.value }))} placeholder="Ej: Almuerzo" />
        <InputMonto label="Monto (COP)" value={form.monto || ""} onChange={v => setForm(f => ({ ...f, monto: v }))} />
        <Select label="Categoría" value={form.categoria || "otro"} onChange={e => setForm(f => ({ ...f, categoria: e.target.value }))}>
          {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
        </Select>
        <SelectorCuenta cuentas={data.cuentas} value={form.cuentaId} onChange={v => setForm(f => ({ ...f, cuentaId: v }))} />
        <div className="pt-node pt-flex">
          <Btn onClick={agregar} className="pt-node pt-grow">Agregar</Btn>
          <Btn variant="ghost" onClick={() => setModal(false)} className="pt-node pt-grow">Cancelar</Btn>
        </div>
      </Modal>

      <Modal open={presupuestoModal} onClose={() => setPresupuestoModal(false)} title="Presupuesto mensual">
        <Select label="Categoría" value={presupuestoForm.categoria || "comida"} onChange={e => setPresupuestoForm(f => ({ ...f, categoria: e.target.value }))}>
          {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
        </Select>
        <InputMonto label="Límite mensual (COP)" value={presupuestoForm.monto || ""} onChange={v => setPresupuestoForm(f => ({ ...f, monto: v }))} />
        <div className="pt-node pt-flex">
          <Btn onClick={guardarPresupuesto} className="pt-node pt-grow">Guardar</Btn>
          <Btn variant="ghost" onClick={() => setPresupuestoModal(false)} className="pt-node pt-grow">Cancelar</Btn>
        </div>
      </Modal>

      {data.gastosFijos.map(fijo => (
        <Modal key={"pagar-" + fijo.id} open={fijoModal === "pagar-" + fijo.id} onClose={() => setFijoModal(null)} title={"Pagar " + fijo.nombre}>
          <InputMonto label="Monto (COP)" value={fijoForm.monto ?? ""} onChange={v => setFijoForm(f => ({ ...f, monto: v }))} />
          <SelectorCuenta cuentas={data.cuentas} value={fijoForm.cuentaId} onChange={v => setFijoForm(f => ({ ...f, cuentaId: v }))} />
          <div className="pt-node pt-flex">
            <Btn onClick={() => pagarFijo(fijo)} className="pt-node pt-grow">Confirmar pago</Btn>
            <Btn variant="ghost" onClick={() => setFijoModal(null)} className="pt-node pt-grow">Cancelar</Btn>
          </div>
        </Modal>
      ))}
      {data.gastosFijos.map(fijo => (
        <Modal key={"editar-" + fijo.id} open={fijoModal === "editar-" + fijo.id} onClose={() => setFijoModal(null)} title="Editar gasto fijo">
          <Input label="Nombre" value={fijoForm.nombre || ""} onChange={e => setFijoForm(f => ({ ...f, nombre: e.target.value }))} />
          <InputMonto label="Monto (COP)" value={fijoForm.monto ?? ""} onChange={v => setFijoForm(f => ({ ...f, monto: v }))} />
          <Select label="Categoría" value={fijoForm.categoria || "otro"} onChange={e => setFijoForm(f => ({ ...f, categoria: e.target.value }))}>
            {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
          </Select>
          <Input label="Nota (opcional)" value={fijoForm.nota || ""} onChange={e => setFijoForm(f => ({ ...f, nota: e.target.value }))} placeholder="Ej: vence el día 5" />
          <div className="pt-node pt-flex pt-space">
            <Btn onClick={guardarFijo} className="pt-node pt-grow">Guardar</Btn>
            <Btn variant="ghost" onClick={() => setFijoModal(null)} className="pt-node pt-grow">Cancelar</Btn>
          </div>
          <Btn variant="danger" onClick={() => eliminarFijo(fijo.id)} className="pt-node pt-full">Eliminar gasto fijo</Btn>
        </Modal>
      ))}
      <Modal open={fijoModal === "nuevo"} onClose={() => setFijoModal(null)} title="Nuevo gasto fijo">
        <Input label="Nombre" value={fijoForm.nombre || ""} onChange={e => setFijoForm(f => ({ ...f, nombre: e.target.value }))} placeholder="Ej: Arriendo" />
        <InputMonto label="Monto (COP)" value={fijoForm.monto || ""} onChange={v => setFijoForm(f => ({ ...f, monto: v }))} />
        <Select label="Categoría" value={fijoForm.categoria || "otro"} onChange={e => setFijoForm(f => ({ ...f, categoria: e.target.value }))}>
          {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
        </Select>
        <Input label="Nota (opcional)" value={fijoForm.nota || ""} onChange={e => setFijoForm(f => ({ ...f, nota: e.target.value }))} placeholder="Ej: vence el día 5" />
        <div className="pt-node pt-flex">
          <Btn onClick={guardarFijo} className="pt-node pt-grow">Agregar</Btn>
          <Btn variant="ghost" onClick={() => setFijoModal(null)} className="pt-node pt-grow">Cancelar</Btn>
        </div>
      </Modal>
    </div>
  );
}

// ─── METAS ───────────────────────────────────────────────────────────────────
function Metas({ data, setData }) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});

  function abonarMeta(id) {
    const monto = parseFloat(form.monto || 0);
    if (!monto) return;
    const cuentaId = form.cuentaId || (data.cuentas[0] && data.cuentas[0].id);
    if (!saldoSuficiente(data, cuentaId, monto)) { alert(mensajeSaldoInsuf(data, cuentaId, monto)); return; }
    const fecha = new Date().toISOString().split("T")[0];
    setData(d => {
      const m = d.metas.find(x => x.id === id);
      const d2 = aplicarMovimiento(d, { tipo: "aporte_meta", monto, signo: "-", descripcion: "Ahorro: " + (m ? m.nombre : "meta"), cuentaId, fecha });
      return { ...d2, metas: d.metas.map(mm => mm.id === id ? { ...mm, actual: Math.min(mm.objetivo, mm.actual + monto) } : mm) };
    });
    setModal(null); setForm({});
  }

  function agregarMeta() {
    const plazo = parseInt(form.plazoMeses || 0) || 6;
    const nueva = { id: Date.now(), nombre: form.nombre || "Nueva meta", objetivo: parseFloat(form.objetivo || 0), actual: 0, color: form.color || "#5E5CE6", plazoMeses: plazo };
    setData(d => ({ ...d, metas: [...d.metas, nueva] }));
    setModal(null); setForm({});
  }

  return (
    <div>
      {data.metas.map(m => {
        const pct = m.objetivo > 0 ? Math.min(100, Math.round((m.actual / m.objetivo) * 100)) : 0;
        const faltante = m.objetivo - m.actual;
        const plazo = m.plazoMeses || 6;
        const ahorroMensual = faltante > 0 ? Math.ceil(faltante / plazo) : 0;
        const mesesRestantes = ahorroMensual > 0 ? Math.ceil(faltante / ahorroMensual) : 0;
        return (
          <Card key={m.id}>
            <div className="pt-node pt-flex pt-between pt-center pt-space">
              <div className="pt-node">🎯 {m.nombre}</div>
              <Badge color={m.color}>{pct}%</Badge>
            </div>
            <ProgressBar value={m.actual} max={m.objetivo} color={m.color} />
            <div className="pt-node pt-flex pt-between pt-space">
              <span className="pt-node">{formatCOP(m.actual)} ahorrado</span>
              <span className="pt-node">Meta: {formatCOP(m.objetivo)}</span>
            </div>
            {faltante > 0 && (
              <div className="pt-node pt-space">
                <div className="pt-node">
                  Faltan <span className="pt-node">{formatCOP(faltante)}</span>
                </div>
                <div className="pt-node pt-space-top">
                  Ahorrando <span className="pt-node">{formatCOP(ahorroMensual)}/mes</span> lo lográs en <span className="pt-node">{mesesRestantes} mes(es)</span>
                </div>
                <div className="pt-node pt-space-top">Plazo definido: {plazo} meses</div>
              </div>
            )}
            <Btn onClick={() => { setForm({ cuentaId: data.cuentas[0]?.id }); setModal("abonar-" + m.id); }} className="pt-node pt-full">+ Agregar ahorro</Btn>
            <Modal open={modal === "abonar-" + m.id} onClose={() => setModal(null)} title={`Ahorrar para ${m.nombre}`}>
              <div className="pt-node pt-space">
                <div className="pt-node">Cuota sugerida: <span className="pt-node">{formatCOP(ahorroMensual)}/mes</span></div>
              </div>
              <InputMonto label="Monto (COP)" value={form.monto || ""} onChange={v => setForm(f => ({ ...f, monto: v }))} />

function Negocios({ data, setData }) {

  function cerrarNegocio(id) {
    const precio = parseFloat(form.precio || 0);

    const cuentaId = form.cuentaId || (data.cuentas[0] && data.cuentas[0].id);
    const fecha = new Date().toISOString().split("T")[0];
    setData(d => {
      const n = d.negocios.find(x => x.id === id);
      const d2 = aplicarMovimiento(d, { tipo: "negocio_venta", monto: precio, signo: "+", descripcion: "Venta: " + (n ? n.nombre : ""), cuentaId, fecha });
      return { ...d2, negocios: d.negocios.map(n2 => n2.id === id ? { ...n2, precioVenta: precio, ganancia: precio - n2.costoTotal, estado: "vendido" } : n2) };
    });
    setModal(null); setForm({});
  }

// ─── PRÉSTAMOS (con abonos parciales) ────────────────────────────────────────
function Prestamos({ data, setData }) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});

  function cerrarTotal(id) {
    const p = data.prestamos.find(x => x.id === id);
    if (!p) return;
    const cuentaId = form.cuentaId || (data.cuentas[0] && data.cuentas[0].id);
    if (p.tipo === "debo" && !saldoSuficiente(data, cuentaId, p.monto)) { alert(mensajeSaldoInsuf(data, cuentaId, p.monto)); return; }
    const fecha = new Date().toISOString().split("T")[0];
    setData(d => {
      const d2 = aplicarMovimiento(d, { tipo: "abono_prestamo", monto: p.monto, signo: p.tipo === "me deben" ? "+" : "-", descripcion: (p.tipo === "me deben" ? "Pago recibido de " : "Pago a ") + p.persona, cuentaId, fecha });
      return { ...d2, prestamos: d.prestamos.filter(x => x.id !== id) };
    });
    setModal(null); setForm({});
  }

  function abonar(id) {
    const monto = parseFloat(form.monto || 0);
    if (!monto) return;
    const cuentaId = form.cuentaId || (data.cuentas[0] && data.cuentas[0].id);
    const p0 = data.prestamos.find(x => x.id === id);
    if (p0 && p0.tipo === "debo" && !saldoSuficiente(data, cuentaId, monto)) { alert(mensajeSaldoInsuf(data, cuentaId, monto)); return; }
    const fecha = new Date().toISOString().split("T")[0];
    setData(d => {
      const p = d.prestamos.find(x => x.id === id);
      if (!p) return d;
      const restante = Math.max(0, p.monto - monto);
      const abonoAplicado = p.monto - restante;
      const d2 = aplicarMovimiento(d, { tipo: "abono_prestamo", monto: abonoAplicado, signo: p.tipo === "me deben" ? "+" : "-", descripcion: (p.tipo === "me deben" ? "Abono recibido de " : "Abono a ") + p.persona, cuentaId, fecha });
      const actualizado = { ...p, monto: restante, abonos: [...(p.abonos || []), { monto: abonoAplicado, fecha, cuentaId }] };
      return {
        ...d2,
        prestamos: restante <= 0 ? d.prestamos.filter(x => x.id !== id) : d.prestamos.map(x => x.id === id ? actualizado : x),
      };
    });
    setModal(null); setForm({});
  }

  function agregar() {
    const nuevo = { id: Date.now(), tipo: form.tipo || "me deben", persona: form.persona || "", monto: parseFloat(form.monto || 0), nota: form.nota || "", abonos: [] };
    setData(d => ({ ...d, prestamos: [...d.prestamos, nuevo] }));
    setModal(null); setForm({});
  }

  const grupos = [
    { key: "me deben", titulo: "ME DEBEN", lista: data.prestamos.filter(p => p.tipo === "me deben"), color: "#30D158", labelCerrar: "Me pagó todo", varCerrar: "success" },
    { key: "debo", titulo: "DEBO", lista: data.prestamos.filter(p => p.tipo === "debo"), color: "#FF453A", labelCerrar: "Pagué todo", varCerrar: "danger" },
  ];

  return (
    <div>
      <div className="pt-node pt-grid pt-grid-2 pt-space">
        <Card className="pt-node">
          <div className="pt-node">ME DEBEN</div>
          <div className="pt-node">{formatCOP(grupos[0].lista.reduce((a, p) => a + p.monto, 0))}</div>
        </Card>
        <Card className="pt-node">
          <div className="pt-node">DEBO</div>
          <div className="pt-node">{formatCOP(grupos[1].lista.reduce((a, p) => a + p.monto, 0))}</div>
        </Card>
      </div>

      {grupos.map(grupo => grupo.lista.length > 0 && (
        <div key={grupo.key}>
          <div className="pt-node pt-space pt-space-top">{grupo.titulo}</div>
          {grupo.lista.map(p => (
            <Card key={p.id}>
              <div className="pt-node pt-space">
                <div className="pt-node">{p.persona}</div>
                <div className="pt-node">{formatCOP(p.monto)}</div>
                {p.nota && <div className="pt-node">{p.nota}</div>}
                {(p.abonos || []).length > 0 && <div className="pt-node pt-space-top">{p.abonos.length} abono(s) registrado(s)</div>}
              </div>
              <div className="pt-node pt-flex">
                <Btn variant="ghost" onClick={() => { setForm({ cuentaId: data.cuentas[0]?.id }); setModal("abono-" + p.id); }} className="pt-node pt-grow">Registrar abono</Btn>
                <Btn variant={grupo.varCerrar} onClick={() => { setForm({ cuentaId: data.cuentas[0]?.id }); setModal("cerrar-" + p.id); }} className="pt-node pt-grow">{grupo.labelCerrar}</Btn>
              </div>
              <Modal open={modal === "abono-" + p.id} onClose={() => setModal(null)} title={`Abono · ${p.persona}`}>
                <div className="pt-node pt-space">Saldo pendiente: {formatCOP(p.monto)}</div>
                <InputMonto label="Monto del abono (COP)" value={form.monto || ""} onChange={v => setForm(f => ({ ...f, monto: v }))} />
                <SelectorCuenta cuentas={data.cuentas} value={form.cuentaId} onChange={v => setForm(f => ({ ...f, cuentaId: v }))} />
                <div className="pt-node pt-flex">
                  <Btn onClick={() => abonar(p.id)} className="pt-node pt-grow">Registrar</Btn>
                  <Btn variant="ghost" onClick={() => setModal(null)} className="pt-node pt-grow">Cancelar</Btn>
                </div>
              </Modal>
              <Modal open={modal === "cerrar-" + p.id} onClose={() => setModal(null)} title={`Cerrar · ${p.persona}`}>
                <div className="pt-node pt-space">Se registrará el pago completo de {formatCOP(p.monto)}.</div>
                <SelectorCuenta cuentas={data.cuentas} value={form.cuentaId} onChange={v => setForm(f => ({ ...f, cuentaId: v }))} />
                <div className="pt-node pt-flex">
                  <Btn onClick={() => cerrarTotal(p.id)} className="pt-node pt-grow">Confirmar</Btn>
                  <Btn variant="ghost" onClick={() => setModal(null)} className="pt-node pt-grow">Cancelar</Btn>
                </div>
              </Modal>
            </Card>
          ))}
        </div>
      ))}

      <Btn variant="ghost" onClick={() => { setModal("nuevo"); setForm({ tipo: "me deben" }); }} className="pt-node pt-full pt-space-top">+ Registrar préstamo</Btn>
      <Modal open={modal === "nuevo"} onClose={() => setModal(null)} title="Nuevo préstamo">
        <Select label="Tipo" value={form.tipo || "me deben"} onChange={e => setForm(f => ({ ...f, tipo: e.target.value }))}>
          <option value="me deben">Me deben</option>
          <option value="debo">Debo</option>
        </Select>
        <Input label="Persona" value={form.persona || ""} onChange={e => setForm(f => ({ ...f, persona: e.target.value }))} placeholder="Ej: Hermano 1" />
        <InputMonto label="Monto (COP)" value={form.monto || ""} onChange={v => setForm(f => ({ ...f, monto: v }))} />
        <Input label="Nota (opcional)" value={form.nota || ""} onChange={e => setForm(f => ({ ...f, nota: e.target.value }))} />
        <div className="pt-node pt-flex">
          <Btn onClick={agregar} className="pt-node pt-grow">Guardar</Btn>
          <Btn variant="ghost" onClick={() => setModal(null)} className="pt-node pt-grow">Cancelar</Btn>
        </div>
      </Modal>
    </div>
  );
}

// ─── REGISTRO RÁPIDO CON IA (texto o dictado por voz) ────────────────────────
function RegistroRapido({ data, setData, open, onClose }) {
  const [texto, setTexto] = useState("");
  const [cuentaId, setCuentaId] = useState("");
  const [estado, setEstado] = useState("idle");
  const [errorMsg, setErrorMsg] = useState("");
  const [ultimo, setUltimo] = useState(null);
  const [escuchando, setEscuchando] = useState(false);

  useEffect(() => {
    if (open) { setEstado("idle"); setErrorMsg(""); if (!cuentaId && data.cuentas[0]) setCuentaId(data.cuentas[0].id); }
  }, [open]);

  function noEncontrado(tipoLabel, textoOriginal) {
    setEstado("error");
    setErrorMsg(`No encontré ${tipoLabel} que coincida con lo que escribiste ("${textoOriginal}"). Registralo primero en su pestaña, o escribí el nombre tal cual aparece ahí.`);
  }
  function saldoInsuf(cuentaId, monto) {
    setEstado("error");
    setErrorMsg(mensajeSaldoInsuf(data, cuentaId, monto));
  }
  function dictar() {
    const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Reconocimiento) { setEstado("error"); setErrorMsg("El dictado no está disponible en este navegador. Podés usar el micrófono del teclado."); return; }
    const reconocimiento = new Reconocimiento();
    reconocimiento.lang = "es-CO";
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;
    reconocimiento.onstart = () => setEscuchando(true);
    reconocimiento.onend = () => setEscuchando(false);
    reconocimiento.onerror = () => { setEscuchando(false); setEstado("error"); setErrorMsg("No pude escuchar el dictado. Revisá el permiso del micrófono e intentá de nuevo."); };
    reconocimiento.onresult = e => setTexto(prev => [prev, e.results[0][0].transcript].filter(Boolean).join(" "));
    reconocimiento.start();
  }

  async function registrar() {
    const apiKey = localStorage.getItem(API_KEY_STORAGE);
    if (!apiKey) { setEstado("error"); setErrorMsg("Primero configurá tu API key gratis de Gemini en Ajustes (⚙️, arriba a la derecha)."); return; }
    if (!texto.trim()) return;
    if (!cuentaId) { setEstado("error"); setErrorMsg("Primero creá una cuenta (tocá el saldo en Inicio)."); return; }
    setEstado("cargando"); setErrorMsg("");
    try {
      const resultado = await parseConIA(texto.trim(), apiKey, { deudas: data.deudas, metas: data.metas, prestamos: data.prestamos, negocios: data.negocios });
      const monto = Math.abs(parseFloat(resultado.monto) || 0);
      if (!monto) { setEstado("error"); setErrorMsg("No identifiqué el monto. Probá de nuevo siendo más específico, ej: 'gasté 15000 en almuerzo'."); return; }
      const fecha = new Date().toISOString().split("T")[0];
      const entidadTexto = (resultado.entidad || "").trim().toLowerCase();
      const tipo = resultado.tipo;

      if (tipo === "ingreso") {
        const descripcion = resultado.descripcion || "Ingreso";
        const nuevo = { id: Date.now(), descripcion, monto, fecha, cuentaId };
        setData(d => {
          const d2 = aplicarMovimiento(d, { tipo: "ingreso", monto, signo: "+", descripcion, cuentaId, fecha });
          return { ...d2, ingresos: [nuevo, ...(d.ingresos || [])] };
        });
        setUltimo({ monto, descripcion, signo: "+" }); setEstado("ok"); setTexto(""); return;
      }

      if (tipo === "abono_deuda") {
        const deuda = entidadTexto && data.deudas.find(x => x.nombre.trim().toLowerCase() === entidadTexto);
        if (!deuda) return noEncontrado("una deuda", texto.trim());
        if (!saldoSuficiente(data, cuentaId, monto)) return saldoInsuf(cuentaId, monto);
        const descripcion = "Abono a " + deuda.nombre;
        setData(d => {
          const d2 = aplicarMovimiento(d, { tipo: "abono_deuda", monto, signo: "-", descripcion, cuentaId, fecha });
          return { ...d2, deudas: d.deudas.map(x => x.id === deuda.id ? { ...x, saldo: Math.max(0, x.saldo - monto), abonos: [...x.abonos, { monto, fecha, cuentaId }] } : x) };
        });
        setUltimo({ monto, descripcion, signo: "-" }); setEstado("ok"); setTexto(""); return;
      }

      if (tipo === "aporte_meta") {
        const meta = entidadTexto && data.metas.find(x => x.nombre.trim().toLowerCase() === entidadTexto);
        if (!meta) return noEncontrado("una meta", texto.trim());
        if (!saldoSuficiente(data, cuentaId, monto)) return saldoInsuf(cuentaId, monto);
        const descripcion = "Ahorro: " + meta.nombre;
        setData(d => {
          const d2 = aplicarMovimiento(d, { tipo: "aporte_meta", monto, signo: "-", descripcion, cuentaId, fecha });
          return { ...d2, metas: d.metas.map(x => x.id === meta.id ? { ...x, actual: Math.min(x.objetivo, x.actual + monto) } : x) };
        });
        setUltimo({ monto, descripcion, signo: "-" }); setEstado("ok"); setTexto(""); return;
      }

      if (tipo === "abono_prestamo") {
        const prestamo = entidadTexto && data.prestamos.find(x => (x.persona || "").trim().toLowerCase() === entidadTexto);
        if (!prestamo) return noEncontrado("un préstamo", texto.trim());
        if (prestamo.tipo === "debo" && !saldoSuficiente(data, cuentaId, monto)) return saldoInsuf(cuentaId, monto);
        const restante = Math.max(0, prestamo.monto - monto);
        const abonoAplicado = prestamo.monto - restante;
        const descripcion = (prestamo.tipo === "me deben" ? "Abono recibido de " : "Abono a ") + prestamo.persona;
        setData(d => {
          const d2 = aplicarMovimiento(d, { tipo: "abono_prestamo", monto: abonoAplicado, signo: prestamo.tipo === "me deben" ? "+" : "-", descripcion, cuentaId, fecha });
          const actualizado = { ...prestamo, monto: restante, abonos: [...(prestamo.abonos || []), { monto: abonoAplicado, fecha, cuentaId }] };
          return { ...d2, prestamos: restante <= 0 ? d.prestamos.filter(x => x.id !== prestamo.id) : d.prestamos.map(x => x.id === prestamo.id ? actualizado : x) };
        });
        setUltimo({ monto: abonoAplicado, descripcion, signo: prestamo.tipo === "me deben" ? "+" : "-" }); setEstado("ok"); setTexto(""); return;
      }

      if (tipo === "negocio_venta") {
        const negocio = entidadTexto && data.negocios.find(x => x.estado === "en curso" && x.nombre.trim().toLowerCase() === entidadTexto);
        if (!negocio) return noEncontrado("un producto en curso", texto.trim());
        const descripcion = "Venta: " + negocio.nombre;
        setData(d => {
          const d2 = aplicarMovimiento(d, { tipo: "negocio_venta", monto, signo: "+", descripcion, cuentaId, fecha });
          return { ...d2, negocios: d.negocios.map(x => x.id === negocio.id ? { ...x, precioVenta: monto, ganancia: monto - x.costoTotal, estado: "vendido" } : x) };
        });
        setUltimo({ monto, descripcion, signo: "+" }); setEstado("ok"); setTexto(""); return;
      }

      if (tipo === "negocio_compra") {
        if (!saldoSuficiente(data, cuentaId, monto)) return saldoInsuf(cuentaId, monto);
        const nombre = resultado.descripcion || "Producto";
        const nuevo = { id: Date.now(), nombre, costoTotal: monto, precioVenta: null, ganancia: null, estado: "en curso", nota: "" };
        const descripcion = "Compra: " + nombre;
        setData(d => {
          const d2 = aplicarMovimiento(d, { tipo: "negocio_compra", monto, signo: "-", descripcion, cuentaId, fecha });
          return { ...d2, negocios: [...d.negocios, nuevo] };
        });
        setUltimo({ monto, descripcion, signo: "-" }); setEstado("ok"); setTexto(""); return;
      }

      // tipo === "gasto"
      if (!saldoSuficiente(data, cuentaId, monto)) return saldoInsuf(cuentaId, monto);
      const categoria = CATEGORIAS.includes(resultado.categoria) ? resultado.categoria : "otro";
      const descripcion = resultado.descripcion || "Gasto";
      const nuevo = { id: Date.now(), descripcion, monto, categoria, fecha, cuentaId };
      setData(d => {
        const d2 = aplicarMovimiento(d, { tipo: "gasto", monto, signo: "-", descripcion, cuentaId, fecha });
        return { ...d2, gastos: [nuevo, ...d.gastos] };
      });
      setUltimo({ monto, descripcion, signo: "-" }); setEstado("ok"); setTexto("");
    } catch (e) {
      setEstado("error"); setErrorMsg("No se pudo conectar con la IA. Revisá tu internet o tu API key en Ajustes. (" + e.message + ")");
    }
  }

  return (
    <Modal open={open} onClose={onClose} title="Registro rápido con IA">
      <div className="pt-node pt-space">
        Escribí o dictá (tocá el micrófono del teclado) algo como <em>"gasté 15 mil en almuerzo"</em>, <em>"aboné 30 mil a la deuda de Nu"</em>, <em>"ahorré 20 mil para la moto"</em> o <em>"Juan me pagó 40 mil"</em>. Usá el mismo nombre que le pusiste a la deuda, meta, persona o producto.
      </div>
      <Btn variant="ghost" onClick={dictar} className="pt-node pt-full pt-space">{escuchando ? "Escuchando…" : "🎙 Dictar movimiento"}</Btn>
      <textarea value={texto} onChange={e => setTexto(e.target.value)} placeholder="Ej: pagué 20000 en transporte" rows={3} className="pt-node pt-full pt-space ios-control ios-textarea" />
      <SelectorCuenta cuentas={data.cuentas} value={cuentaId} onChange={setCuentaId} />
      {estado === "error" && <div className="pt-node pt-space">{errorMsg}</div>}
      {estado === "ok" && ultimo && <div className="pt-node pt-space">Registrado: {ultimo.signo === "+" ? "+ " : "- "}{formatCOP(ultimo.monto)} · {ultimo.descripcion}</div>}
      <div className="pt-node pt-flex">
        <Btn onClick={registrar} className="pt-node pt-grow">{estado === "cargando" ? "Pensando..." : "Registrar con IA"}</Btn>
        <Btn variant="ghost" onClick={onClose} className="pt-node pt-grow">Cerrar</Btn>
      </div>
    </Modal>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("dashboard");
  const [data, setDataRaw] = useState(loadData);
  const [ajustesOpen, setAjustesOpen] = useState(false);
  const [registroOpen, setRegistroOpen] = useState(false);

  function setData(updater) {
    setDataRaw(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }

  const TABS = [
    { id: "dashboard", label: "Inicio", icon: "house" },
    { id: "gastos", label: "Gastos", icon: "cart" },
    { id: "deudas", label: "Deudas", icon: "creditcard" },
    { id: "metas", label: "Metas", icon: "target" },
    { id: "negocios", label: "Negocios", icon: "box" },
    { id: "prestamos", label: "Préstamos", icon: "people" },
  ];
  const tabIds = TABS.map(t => t.id);
  const touchRef = useRef({ x: 0, y: 0, activo: false });

  function irA(id) { setTab(id); }

  function onTouchStart(e) {
    if (e.target.closest && e.target.closest('[data-modal="true"]')) { touchRef.current.activo = false; return; }
    const t = e.touches[0];
    touchRef.current = { x: t.clientX, y: t.clientY, activo: true };
  }
  function onTouchEnd(e) {
    if (!touchRef.current.activo) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    touchRef.current.activo = false;
    // Solo cuenta como swipe si es claramente horizontal y supera un umbral
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      const idx = tabIds.indexOf(tab);
      if (dx < 0 && idx < tabIds.length - 1) setTab(tabIds[idx + 1]);
      else if (dx > 0 && idx > 0) setTab(tabIds[idx - 1]);
    }
  }

  return (
    <main className="ios-screen">
      <header className="ios-header">
        <h1 className="ios-title">Finanzas</h1>
        <div className="ios-header-actions">
          <button onClick={() => setRegistroOpen(true)} aria-label="Registro rápido con IA" className="ios-icon-button pressable">
            <Icon name="sparkles" size={18} filled />
          </button>
          <button onClick={() => setAjustesOpen(true)} aria-label="Ajustes" className="ios-icon-button pressable">
            <Icon name="gear" size={19} />
          </button>
        </div>
      </header>

      <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} className="pt-node">
        <div key={tab} className="tab-panel">
          {tab === "dashboard" && <Dashboard data={data} setData={setData} goTo={irA} />}
          {tab === "gastos" && <Gastos data={data} setData={setData} />}
          {tab === "deudas" && <Deudas data={data} setData={setData} />}
          {tab === "metas" && <Metas data={data} setData={setData} />}
          {tab === "negocios" && <Negocios data={data} setData={setData} />}
          {tab === "prestamos" && <Prestamos data={data} setData={setData} />}
        </div>
      </div>

      <TabBar tabs={TABS} active={tab} onChange={setTab} />
      <RegistroRapido data={data} setData={setData} open={registroOpen} onClose={() => setRegistroOpen(false)} />
      <Ajustes open={ajustesOpen} onClose={() => setAjustesOpen(false)} />
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
